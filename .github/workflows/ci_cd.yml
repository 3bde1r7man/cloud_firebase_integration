name: Firebase App Distribution

on:
  push:
    branches: [main] # Trigger on pushes to the main branch
  pull_request:
    branches: [main] # Trigger on pull requests to the main branch

jobs:
  build-and-distribute:
    name: Build and Distribute to Firebase App Distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x' # Replace with your desired Flutter version
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android App Bundle
        run: flutter build appbundle --release

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v2
        with:
          appId: 1:890847617998:android:950b056707d32bc07bc19f
          token: 1//03GdWU5wPfazuCgYIARAAGAMSNwF-L9IrGce0utfOEgM_pH6o_tazdO-SgMk34oCUR-SmUiqqM8hn8gyUKkwA9XLopgFIeymbeGY
          groups: abdo 
          file: build/app/outputs/bundle/release/app-release.aab
          releaseNotes: "Build ${{ github.run_number }} - Commit ${{ github.sha }}" # Optional release notes