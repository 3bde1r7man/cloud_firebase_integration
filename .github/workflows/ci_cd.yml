name: Flutter CI/CD

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # Checkout code
      - uses: actions/checkout@v3

      # Set up Flutter using the public action
      - name: Set up Flutter
        uses: subosito/flutter-action@v2  # Do not replace 'subosito'

      # Install dependencies
      - name: Install Dependencies
        run: flutter pub get

      # Run tests
      - name: Run Tests
        run: flutter test

      # Build Android app
      - name: Build Android App
        run: flutter build apk --release

      # Distribute Android App via Firebase App Distribution
      - name: Distribute Android App via Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appPath: build/app/outputs/flutter-apk/app-release.apk
          appId: 1:890847617998:android:950b056707d32bc07bc19f
          serviceCredentialsJson: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: "abdo"