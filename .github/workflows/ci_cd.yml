name: Flutter CI/CD

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # Checkout code
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'


      # Set up Flutter using the public action
      - name: Set up Flutter
        uses: subosito/flutter-action@v2  # Do not replace 'subosito'

      # Install dependencies
      - name: Install Dependencies
        run: flutter pub get

      # Run tests
      - name: Run Tests
        run: flutter test

      # Build Android app
      - name: Build Android App
        run: flutter build apk --release
      
